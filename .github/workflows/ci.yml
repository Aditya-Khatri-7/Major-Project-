name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-training.txt -r requirements-frontend.txt pytest httpx ruff

      - name: Lint
        run: ruff check .

      - name: Test (no models, no API key needed)
        run: pytest tests/ -v

  docker-build:
    # Verifies the "docker compose up works from a clean clone" claim: builds the images and imports the app inside them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image (CPU)
        run: docker build -f Dockerfile.api -t forensics-api .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t forensics-frontend .

      - name: Import the app inside the API image (catches missing runtime packages)
        run: >
          docker run --rm forensics-api python -c
          "import api.main, agents.orchestrator, joblib, sklearn, httpx; print('api image imports ok')"

      - name: No secrets baked into the images
        run: |
          ! docker run --rm forensics-api sh -c 'test -f .env || ls -a | grep -x ".env"' | grep -q ".env"
