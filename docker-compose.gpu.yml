# Overlay that gives the API container the NVIDIA GPU and a CUDA build of PyTorch.
# Requires the NVIDIA Container Toolkit on the host.
services:
  api:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
